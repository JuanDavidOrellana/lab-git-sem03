<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Exploración Espacial</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #0b1026; color: white;">

    <nav style="background-color: #151d45; padding: 20px; text-align: center;">
        <a href="index.html" style="color: #ffffff; margin: 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: #ffffff; margin: 15px; text-decoration: none;">Sobre nosotros</a>
        <a href="contact.html" style="color: #66ccff; margin: 15px; text-decoration: none;">Contacto</a>
    </nav>

    <main style="max-width: 600px; margin: 50px auto; padding: 30px;">
        <h1 style="color: #66ccff;">Contacto</h1>

        <p>
            ¿Tienes alguna pregunta o quieres compartir una idea?
            Puedes enviarnos un mensaje mediante este formulario.
        </p>

        <form style="margin-top: 30px;">
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"
                   style="width: 100%; padding: 10px; margin: 8px 0 20px; box-sizing: border-box;">

            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email"
                   style="width: 100%; padding: 10px; margin: 8px 0 20px; box-sizing: border-box;">

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5"
                      style="width: 100%; padding: 10px; margin: 8px 0 20px; box-sizing: border-box;"></textarea>

            <button type="submit"
                    style="background-color: #3388cc; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer;">
                Enviar mensaje
            </button>
        </form>
    </main>

</body>
</html>
